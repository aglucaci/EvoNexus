name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit and schema tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The fallback sampler keeps CI free of the heavy PyMC stack.
          pip install -r requirements-ci.txt

      - name: Lint
        run: ruff check scripts tests

      - name: Run tests
        env:
          PYTHONPATH: scripts
          MPLBACKEND: Agg
          OMP_NUM_THREADS: '1'
        run: pytest tests -q --cov=scripts/evonexus --cov-report=term-missing

      - name: Data dictionary is up to date
        env:
          PYTHONPATH: scripts
        run: |
          python -m evonexus.cli schema --markdown /tmp/DATA_DICTIONARY.md
          diff -u docs/DATA_DICTIONARY.md /tmp/DATA_DICTIONARY.md

  integration:
    name: Deterministic synthetic pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run the synthetic pipeline end to end
        env:
          PYTHONPATH: scripts
          MPLBACKEND: Agg
          OMP_NUM_THREADS: '1'
        run: bash bin/run_synthetic_pipeline.sh results/ci

      - name: Assert honest reporting of unavailable analyses
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open('results/ci/manuscript/manuscript_manifest.json'))
          assert m['synthetic'] is True, 'a synthetic run must be labelled synthetic'
          # No sequences are supplied in CI, so Figure 4 must be marked missing.
          assert m['figures']['Figure4']['status'] == 'not_generated'
          assert m['tables']['S4']['status'] == 'not_generated'
          for name in ('Figure1', 'Figure2', 'Figure3', 'Figure5'):
              assert m['figures'][name]['status'] == 'ok', name
          print('reporting behaved as specified')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-outputs
          path: |
            results/ci/figures/*.png
            results/ci/manuscript/
            results/ci/qc/qc_report.md
          retention-days: 14

  nextflow:
    name: Nextflow pipeline (${{ matrix.nextflow }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range, each with a JDK that version can
        # actually run on. Nextflow bundles its own Groovy, so a JDK newer
        # than the release supports fails with "Unsupported class file major
        # version" before any pipeline code is parsed — Java 25 needs
        # Nextflow 26+. Testing only one end hides real breakage: the strict
        # syntax of 25.10+ rejects constructs the old parser accepted, while
        # older releases lack newer output forms.
        include:
          - nextflow: '24.10.5'
            java: '17'
          - nextflow: 'latest-stable'
            java: '21'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.nextflow }}

      - name: Help text
        run: nextflow run . --help

      - name: Run the synthetic profile through the real DAG
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: '1'
        run: nextflow run . -profile test

      - name: Assert the published tree has the expected shape
        run: |
          python - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path('results/test')
          expected = {'acquisition', 'processed', 'qc', 'matrix', 'bayesian',
                      'connectivity', 'validation', 'evolution', 'figures',
                      'tables', 'manuscript', 'figure_legends', 'docs'}
          present = {p.name for p in root.iterdir() if p.is_dir()}
          missing = expected - present
          assert not missing, f'missing output directories: {sorted(missing)}'
          # A stage must not publish into a directory named after itself.
          doubled = [str(p) for p in root.rglob('*') if p.is_dir() and p.name == p.parent.name]
          assert not doubled, f'doubly nested publish paths: {doubled}'
          m = json.loads((root / 'manuscript' / 'manuscript_manifest.json').read_text())
          assert m['synthetic'] is True
          assert m['figures']['Figure4']['status'] == 'not_generated'
          print('published tree is correct')
          PY

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nextflow-log-${{ matrix.nextflow }}
          path: .nextflow.log
          retention-days: 7
